name: Deploy Hello World App to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main # Trigger on pushes to main branch
env:
  TF_VAR_region: ${{ vars.AWS_REGION }} # 👈 GitHub variable
jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} # ensures you get the PR branch
          path: infra # optional: specify directory
          submodules: true # if configs are in submodules

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan > plan.txt

      - name: Check if plan has changes
        id: changes
        run: |
          terraform show -no-color tfplan > plan.out
          if grep -q "No changes. Infrastructure is up-to-date." plan.out; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply only if changes
        if: steps.changes.outputs.changed == 'true'
        run: terraform apply -auto-approve tfplan
